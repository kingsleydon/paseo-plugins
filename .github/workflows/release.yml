# Keeps a release PR open with the next version and CHANGELOG.md of each changed plugin, from
# Conventional Commits on main. Merging it tags `<folder>-v<version>` and creates the GitHub Release;
# the tag starts publish.yml.
name: Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App token, unlike GITHUB_TOKEN, lets the release PR run CI and the tag run publish.yml.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
