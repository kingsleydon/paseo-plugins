# Publishes one plugin to npm with trusted publishing (OIDC): no npm token is stored anywhere.
# Runs on the <folder>-v<version> tags that release.yml creates: recap-v0.2.4 publishes plugins/recap
# at version 0.2.4.
name: Publish to npm

on:
  push:
    tags:
      - "*-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # npm trusts only this environment, which GitHub restricts to *-v* tags.
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the plugin folder from the tag
        id: plugin
        env:
          TAG: ${{ github.ref_name }}
        run: |
          folder="${TAG%-v*}"
          version="${TAG##*-v}"
          [[ "$folder" =~ ^[a-z][a-z0-9-]*$ ]] || { echo "Invalid plugin folder in tag: $folder"; exit 1; }
          test -f "plugins/$folder/package.json" || { echo "No plugin at plugins/$folder"; exit 1; }
          actual="$(node -p 'require(process.argv[1]).version' "./plugins/$folder/package.json")"
          test "$actual" = "$version" || { echo "Tag version $version does not match package.json $actual"; exit 1; }
          echo "dir=plugins/$folder" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm ci
      - working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm run typecheck
      - working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm test
      - working-directory: ${{ steps.plugin.outputs.dir }}
        run: npm publish --access public
